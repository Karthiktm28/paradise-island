<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradise Island | Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Scroll Progress Bar -->
  <div class="scroll-progress"></div>

  <!-- Page Transition Wrapper -->
  <div class="page-transition">

    <!-- Navigation -->
    <nav class="about-nav">
      <div class="logo">Paradise Island</div>
      <div class="nav-links">
        <a href="About.html">Home</a>
        <a href="Destination.html">Destinations</a>
        <a href="Booking.html">Booking</a>
        <a href="Form.html" class="active">Contact</a>
      </div>
      <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
    </nav>

    <!-- Contact Form Section -->
    <section class="booking-section">
      <div class="booking-container">
        <h1>Contact Us</h1>

        <form class="booking-form" id="contactForm" novalidate>

          <!-- Username -->
          <div class="form-group full-width">
            <label for="Username">Username</label>
            <input
              type="text"
              id="Username"
              name="Username"
              placeholder="Enter your username"
              required
              autocomplete="username"
              minlength="5"
              maxlength="20">
          </div>

          <!-- Password -->
          <div class="form-group full-width">
            <label for="Password">Password</label>
            <input
              type="password"
              id="Password"
              name="Password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
              minlength="5"
              maxlength="20">
          </div>

          <!-- Disabled Field -->
          <div class="form-group full-width">
            <label for="disabledInput">Reference Code</label>
            <input
              type="text"
              id="disabledInput"
              name="disabledInput"
              placeholder="Auto-generated on submission"
              disabled>
          </div>

          <!-- Submit -->
          <div class="form-group full-width">
            <button type="submit" class="btn-submit">Submit</button>
          </div>

        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-container">
        <h3>Paradise Island</h3>
        <p>Plan your dream vacation today</p>
        <div class="footer-links">
          <a href="About.html">Home</a>
          <a href="Destination.html">Destinations</a>
          <a href="Booking.html">Booking</a>
          <a href="Form.html">Contact</a>
        </div>
        <p class="footer-copy">© 2026 Paradise Island. All rights reserved.</p>
      </div>
    </footer>

  </div><!-- end .page-transition -->

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
