<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<h1>Please Enter Your Details</h1>
<form>
<label for="Username">Username:</label>
<br/>
<input type="text" id="Username" name="Username" placeholder="Enter username" required autocomplete="on" maxlength="20" minlength="5" size="30">
<br/>

<label for="Password">Password:</label>
<br/>
<input type="password" id="Password" name="Password" placeholder="Enter password" required autocomplete="on" maxlength="20" minlength="5" size="30">
<br/>

<label for="Disabled Input">Disabled Input:</label>
<br/>
<input type="text" id="Disabled Input" name="Disabled Input" placeholder="This field is disabled" disabled>
<br/>

<input type="submit" id="Submit" value="Submit" />
</form>
</body>
</html>
