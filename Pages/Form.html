<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paradise Island | Contact</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  
    <div class="scroll-progress"></div>
    <div class="page-transition">
<h1>Please Enter Your Details</h1>
<form>
<label for="Username">Username:</label>
<br/>
<input type="text" id="Username" name="Username" placeholder="Enter username" required autocomplete="on" maxlength="20" minlength="5" size="30">
<br/>

<label for="Password">Password:</label>
<br/>
<input type="password" id="Password" name="Password" placeholder="Enter password" required autocomplete="on" maxlength="20" minlength="5" size="30">
<br/>

<label for="Disabled Input">Disabled Input:</label>
<br/>
<input type="text" id="Disabled Input" name="Disabled Input" placeholder="This field is disabled" disabled>
<br/>

<input type="submit" id="Submit" value="Submit" />
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../scroll.js"></script>

<script>
window.addEventListener("load", function () {
  const page = document.querySelector(".page-transition");
  if (page) {
    page.classList.add("loaded");
  }
});
</script>
<script src="js/main.js"></script>
</body>
</html>
